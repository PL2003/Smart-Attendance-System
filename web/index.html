<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="10">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Attendance Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .header h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(238, 90, 36, 0.3);
            transition: transform 0.3s ease;
        }

        .stat-card:nth-child(2) {
            background: linear-gradient(135deg, #48c6ef, #6f86d6);
            box-shadow: 0 10px 25px rgba(72, 198, 239, 0.3);
        }

        .stat-card:nth-child(3) {
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            color: #333;
            box-shadow: 0 10px 25px rgba(168, 237, 234, 0.3);
        }

        .stat-card:nth-child(4) {
            background: linear-gradient(135deg, #ffecd2, #fcb69f);
            color: #333;
            box-shadow: 0 10px 25px rgba(252, 182, 159, 0.3);
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .date-filter {
            padding: 10px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .date-filter:focus {
            border-color: #667eea;
            outline: none;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .refresh-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .last-updated {
            color: #666;
            font-size: 0.9rem;
            margin-left: auto;
        }

        .attendance-table {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            transition: background-color 0.3s ease;
        }

        tr:hover td {
            background-color: #f8f9ff;
        }

        tr:nth-child(even) td {
            background-color: #fafafa;
        }

        .status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status.present {
            background: #d4edda;
            color: #155724;
        }

        .status.late {
            background: #fff3cd;
            color: #856404;
        }

        .status.absent {
            background: #f8d7da;
            color: #721c24;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
            font-size: 1.1rem;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid #f5c6cb;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 10px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .last-updated {
                margin-left: 0;
                margin-top: 10px;
            }
            
            table {
                font-size: 0.9rem;
            }
            
            th, td {
                padding: 10px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Live Attendance Dashboard</h1>
            <p>Real-time attendance monitoring system</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="todayCount">0</div>
                <div class="stat-label">Today's Attendance</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalStudents">0</div>
                <div class="stat-label">Total Students</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="presentPercentage">0%</div>
                <div class="stat-label">Attendance Rate</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="lastEntry">--:--</div>
                <div class="stat-label">Last Entry</div>
            </div>
        </div>

        <div class="controls">
            <input type="date" id="dateFilter" class="date-filter" placeholder="Select date or leave empty for latest">
            <button onclick="refreshData()" class="refresh-btn" id="refreshBtn">
                🔄 Refresh Data
            </button>
            <button onclick="showLatestData()" class="refresh-btn" style="background: linear-gradient(135deg, #28a745, #20c997);">
                📅 Show Latest Data
            </button>
            <div class="last-updated" id="lastUpdated">
                Last updated: Never
            </div>
        </div>

        <div class="attendance-table">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Student ID</th>
                        <th>Student Name</th>
                    </tr>
                </thead>
                <tbody id="attendanceTableBody">
                    <tr>
                        <td colspan="4" class="loading">
                            <div class="spinner"></div>
                            Loading attendance data...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Configuration - Replace with your actual Web App URL
        const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwH4xGC3uX53p5DnOGnFcpdVitxFZRLjpJT0VkP5l52ICxZ1lc-jKF0gHH9DicgQaQ-/exec?action=getData';
        
        let allAttendanceData = [];
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Don't set today's date automatically - let user choose or detect from data
            // const today = new Date().toISOString().split('T')[0];
            // document.getElementById('dateFilter').value = today;
            
            // Load data initially
            refreshData();
            
            // Auto refresh every 30 seconds
            setInterval(refreshData, 30000);
            
            // Add event listener for date filter
            document.getElementById('dateFilter').addEventListener('change', filterData);
            
            // Add test button for debugging
            const testBtn = document.createElement('button');
            testBtn.textContent = 'Test Connection';
            testBtn.onclick = testConnection;
            testBtn.style.marginLeft = '10px';
            document.querySelector('.controls').appendChild(testBtn);
        });

        async function refreshData() {
            const refreshBtn = document.getElementById('refreshBtn');
            refreshBtn.disabled = true;
            refreshBtn.innerHTML = '<div class="spinner"></div> Loading...';
            
            try {
                console.log('Fetching data from:', WEBAPP_URL);
                const response = await fetch(WEBAPP_URL);
                
                console.log('Response status:', response.status);
                console.log('Response ok:', response.ok);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const rawText = await response.text();
                console.log('Raw response:', rawText);
                
                let data;
                try {
                    data = JSON.parse(rawText);
                } catch (parseError) {
                    console.error('JSON parse error:', parseError);
                    throw new Error('Response is not valid JSON: ' + rawText.substring(0, 200));
                }
                
                console.log('Parsed data:', data);
                console.log('Data type:', typeof data);
                console.log('Is array:', Array.isArray(data));
                
                if (Array.isArray(data)) {
                    allAttendanceData = data;
                    console.log('All attendance data:', allAttendanceData);
                    filterData();
                    updateLastUpdated();
                } else {
                    console.error('Data is not an array:', data);
                    throw new Error('Invalid data format received - expected array, got: ' + typeof data);
                }
                
            } catch (error) {
                console.error('Error fetching data:', error);
                showError('⚠️ Failed to fetch attendance data: ' + error.message);
            }
            
            refreshBtn.disabled = false;
            refreshBtn.innerHTML = '🔄 Refresh Data';
        }

        function filterData() {
            let selectedDate = document.getElementById('dateFilter').value;
            
            // If no date is selected, use the most recent date from the data
            if (!selectedDate && allAttendanceData.length > 0) {
                const dates = allAttendanceData.map(record => {
                    try {
                        return new Date(record.date).toISOString().split('T')[0];
                    } catch (e) {
                        return null;
                    }
                }).filter(Boolean);
                
                if (dates.length > 0) {
                    selectedDate = dates.sort().reverse()[0]; // Get the most recent date
                    document.getElementById('dateFilter').value = selectedDate;
                }
            }
            
            console.log('Selected date for filtering:', selectedDate);
            console.log('All data to filter:', allAttendanceData);
            
            if (!selectedDate) {
                // If still no date, show all data
                console.log('No date selected, showing all data');
                updateTable(allAttendanceData);
                updateStats(allAttendanceData);
                return;
            }
            
            // Filter data for selected date
            const filteredData = allAttendanceData.filter(record => {
                console.log('Processing record:', record);
                if (!record.date) {
                    console.log('Record has no date field');
                    return false;
                }
                
                // Handle different date formats
                let recordDate = record.date.toString();
                console.log('Record date (original):', recordDate);
                
                // If date is in YYYY-MM-DD format, use as is
                if (recordDate.match(/^\d{4}-\d{2}-\d{2}$/)) {
                    console.log('Date is already in YYYY-MM-DD format');
                    const matches = recordDate === selectedDate;
                    console.log('Date matches selected:', matches);
                    return matches;
                }
                
                // Convert other formats to YYYY-MM-DD
                try {
                    const date = new Date(recordDate);
                    const formattedDate = date.toISOString().split('T')[0];
                    console.log('Converted date to:', formattedDate);
                    const matches = formattedDate === selectedDate;
                    console.log('Converted date matches selected:', matches);
                    return matches;
                } catch (e) {
                    console.warn('Could not parse date:', recordDate, e);
                    return false;
                }
            });
            
            console.log('Filtered data:', filteredData);
            updateTable(filteredData);
            updateStats(filteredData);
        }

        function updateTable(data) {
            const tbody = document.getElementById('attendanceTableBody');
            
            if (data.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" style="text-align: center; padding: 30px; color: #666;">
                            📭 No attendance records found for the selected date
                        </td>
                    </tr>
                `;
                return;
            }
            
            // Sort by datetime (most recent first)
            data.sort((a, b) => {
                const dateA = new Date(a.datetime || a.date + ' ' + a.time);
                const dateB = new Date(b.datetime || b.date + ' ' + b.time);
                return dateB - dateA;
            });
            
            tbody.innerHTML = data.map(record => {
                // Format date
                let displayDate = record.date;
                try {
                    const date = new Date(record.date);
                    displayDate = date.toLocaleDateString();
                } catch (e) {
                    // Use original if parsing fails
                }
                
                return `
                    <tr>
                        <td>${displayDate}</td>
                        <td>${formatTime(record.time)}</td>
                        <td>${record.student_id}</td>
                        <td>${record.student_name}</td>
                    </tr>
                `;
            }).join('');
        }

        function updateStats(todayData) {
            // Get stats from first record (if available)
            const stats = todayData.length > 0 ? todayData[0] : { ta: 0, ts: 0, pr: 0 };
            
            // Today's attendance count
            const todayCount = stats.ta || todayData.length;
            document.getElementById('todayCount').textContent = todayCount;
            
            // Total students
            const totalStudents = stats.ts || 30; // fallback to 30 if not available
            document.getElementById('totalStudents').textContent = totalStudents;
            
            // Attendance percentage
            const percentage = totalStudents > 0 ? Math.round((todayCount / totalStudents) * 100) : 0;
            document.getElementById('presentPercentage').textContent = percentage + '%';
            
            // Last entry time
            if (todayData.length > 0) {
                const sortedData = [...todayData].sort((a, b) => {
                    const dateA = new Date(a.datetime || a.date + ' ' + a.time);
                    const dateB = new Date(b.datetime || b.date + ' ' + b.time);
                    return dateB - dateA;
                });
                document.getElementById('lastEntry').textContent = formatTime(sortedData[0].time);
            } else {
                document.getElementById('lastEntry').textContent = '--:--';
            }
        }

        function formatTime(timeString) {
            if (!timeString) return '--:--';
            
            try {
                // Handle full datetime strings like "1899-12-30T03:56:40.000Z"
                if (timeString.includes('T')) {
                    const date = new Date(timeString);
                    const hours = date.getUTCHours().toString().padStart(2, '0');
                    const minutes = date.getUTCMinutes().toString().padStart(2, '0');
                    return `${hours}:${minutes}`;
                }
                
                // Handle time strings with colons
                if (timeString.includes(':')) {
                    const parts = timeString.split(':');
                    if (parts.length >= 2) {
                        return `${parts[0].padStart(2, '0')}:${parts[1].padStart(2, '0')}`;
                    }
                }
                
                return timeString;
            } catch (e) {
                console.warn('Could not format time:', timeString, e);
                return timeString;
            }
        }

        function updateLastUpdated() {
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            document.getElementById('lastUpdated').textContent = `Last updated: ${timeString}`;
        }

        function showError(message) {
            const tbody = document.getElementById('attendanceTableBody');
            tbody.innerHTML = `
                <tr>
                    <td colspan="4">
                        <div class="error">
                            ${message}
                        </div>
                    </td>
                </tr>
            `;
        }

        // Test connection function (you can call this from browser console)
        async function testConnection() {
            try {
                const response = await fetch(WEBAPP_URL);
                const data = await response.json();
                console.log('Connection test result:', data);
                return data;
            } catch (error) {
                console.error('Connection test failed:', error);
                return null;
            }
        }

        // Show latest data function
        function showLatestData() {
            if (allAttendanceData.length === 0) {
                alert('No data available. Please refresh first.');
                return;
            }
            
            // Find the most recent date in the data
            const dates = allAttendanceData.map(record => {
                try {
                    return new Date(record.date).toISOString().split('T')[0];
                } catch (e) {
                    return null;
                }
            }).filter(Boolean);
            
            if (dates.length > 0) {
                const latestDate = dates.sort().reverse()[0];
                document.getElementById('dateFilter').value = latestDate;
                filterData();
            }
        }
    </script>
</body>
</html>
